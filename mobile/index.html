<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket USAMM</title>
<meta name="description" content="Pocket reference for USAMM modeled livestock movement — 15 states, cattle · beef · dairy · swine.">
<meta name="theme-color" content="#2e4a2b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111811" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket USAMM">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e4a2b'/%3E%3Ccircle cx='22' cy='32' r='9' fill='%23d8b53f'/%3E%3Ccircle cx='45' cy='20' r='5' fill='%23eef3ea'/%3E%3Ccircle cx='45' cy='44' r='5' fill='%23eef3ea'/%3E%3Cpath d='M29 29l11-7M29 35l11 7' stroke='%23eef3ea' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<style>
/* ================= tokens ================= */
:root{
  --bg:#f4f5f0; --card:#ffffff; --well:#ffffff; --line:#dcdcd4;
  --ink:#1c2b1a; --muted:#5f6b5c; --head:#2e4a2b; --accent:#3b6b3a;
  --gold:#d8b53f; --soft:#eef3ea; --press:#e7ebe2;
  --shadow:0 1px 2px rgba(28,43,26,.06),0 4px 14px rgba(28,43,26,.05);
  --sheet-ink:#1c2b1a; --sheet-muted:#5f6b5c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111811; --card:#1a231a; --well:#ffffff; --line:#2b352b;
    --ink:#e7ece3; --muted:#a3b09e; --head:#b9d3ae; --accent:#7fae7a;
    --soft:#223122; --press:#243024;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
  }
}
/* ================= base ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
body.has-sheet{position:fixed;left:0;right:0;width:100%;overflow:hidden}
a{color:inherit;text-decoration:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}

/* ================= top bar ================= */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid var(--line);
}
.tb-row{display:flex;align-items:center;gap:10px;min-height:36px}
.tb-back{
  flex:0 0 auto;display:flex;align-items:center;gap:2px;color:var(--accent);
  font-size:16px;font-weight:600;padding:6px 8px 6px 2px;margin-left:-4px;border-radius:9px;
}
.tb-back:active{background:var(--press)}
.tb-title{flex:1;font-size:21px;font-weight:800;color:var(--head);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-about{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--accent);font-weight:700;font-size:15px;border:1.5px solid var(--line);
  position:relative}
.tb-about::after{content:"";position:absolute;inset:-6px}
.tb-about:active{background:var(--press)}

/* segmented controls */
.seg{
  position:relative;display:grid;margin-top:10px;background:var(--soft);
  border-radius:11px;padding:3px;user-select:none;-webkit-user-select:none;
}
.seg.cats{grid-template-columns:repeat(4,1fr)}
.seg.dirs{grid-template-columns:repeat(2,1fr);margin-top:8px}
.seg .thumb{
  position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--accent);
  box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .18s ease,background .18s ease;
  width:calc(25% - 1.5px);
}
.seg.dirs .thumb{width:calc(50% - 3px)}
.seg.swine .thumb{background:var(--gold)}
.seg button{
  position:relative;z-index:1;appearance:none;background:none;border:0;padding:9px 0 8px;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:9px;
  transition:color .18s ease;min-height:40px;
}
.seg button[aria-pressed="true"]{color:#fff}
.seg.swine button[aria-pressed="true"]{color:#3a3113}
@media (prefers-color-scheme: dark){
  .seg button[aria-pressed="true"]{color:#10190f}
}

/* ================= picker ================= */
.hero-head{padding:26px 16px 6px}
.hero-head h1{margin:0;font-size:30px;font-weight:800;color:var(--head);letter-spacing:-.02em}
.hero-head p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.list{padding:12px 14px 8px;display:flex;flex-direction:column;gap:9px}
.row{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;min-height:56px;box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.row:active{transform:scale(.975);background:var(--press)}
.row .ab{
  flex:0 0 40px;height:40px;border-radius:10px;background:var(--head);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.02em;
}
@media (prefers-color-scheme: dark){ .row .ab{background:var(--accent);color:#10190f} }
.row .nm{flex:1;font-weight:650;font-size:16.5px}
.row .sc{color:var(--muted);font-size:13px;text-align:right;line-height:1.25}
.row .ch{color:var(--line);font-size:22px;font-weight:400;margin-left:2px}
.row.resume{border-color:var(--accent)}
.row.resume .tagline{font-size:11.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sect-label{padding:14px 18px 2px;font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}

/* ================= state card ================= */
.card-body{padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px}
.card-body.enter > *{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.card-body.enter > *:nth-child(2){animation-delay:.03s}
.card-body.enter > *:nth-child(3){animation-delay:.06s}
.card-body.enter > *:nth-child(4){animation-delay:.09s}
.card-body.enter > *:nth-child(5){animation-delay:.12s}
.card-body.enter > *:nth-child(n+6){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

section.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:var(--shadow)}
.blk h3{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em}
.cap{margin-top:8px;font-size:11.5px;color:var(--muted)}
.prose{font-size:14.5px;margin:0 0 10px;color:var(--ink)}
.prose b{color:var(--head)}

.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--soft);border-radius:12px;padding:12px 12px 10px;min-height:74px;
  display:flex;flex-direction:column;justify-content:center}
.tile .v{font-size:27px;font-weight:800;color:var(--head);letter-spacing:-.02em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted);margin-top:3px}
.tile.gold .v{color:#8a6d14}
@media (prefers-color-scheme: dark){ .tile.gold .v{color:var(--gold)} }

.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--soft);border-radius:12px;padding:10px 12px}
.mini .v{font-size:19px;font-weight:750;color:var(--head);font-variant-numeric:tabular-nums}
.mini .k{font-size:11.5px;color:var(--muted);margin-top:1px}

.chart{width:100%;max-width:430px;margin:0 auto;background:var(--well);border-radius:10px;padding:6px}
.chart svg{display:block}

.mapbtns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mapbtn{
  display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;font-weight:650;font-size:14.5px;color:var(--head);background:var(--card);
  transition:transform .12s ease;min-height:48px;
}
.mapbtn:active{transform:scale(.975);background:var(--press)}
.mapbtn .sz{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted)}
.mapbtn .ic{width:22px;height:22px;flex:0 0 auto;color:var(--accent)}

.notecard{background:var(--soft);border-left:4px solid var(--gold);border-radius:10px;
  padding:12px 14px;font-size:14px}
.notecard b{display:block;color:var(--head);margin-bottom:3px}

.footer{padding:4px 6px 8px;font-size:11.5px;color:var(--muted);line-height:1.55}
.footer a{color:var(--accent);font-weight:650}
.pagefoot{padding:16px 18px calc(18px + env(safe-area-inset-bottom));font-size:11.5px;
  color:var(--muted);text-align:center;line-height:1.55}
.pagefoot a{color:var(--accent);font-weight:650}

/* ================= about ================= */
.about{padding:16px 18px 30px;max-width:560px}
.about h2{font-size:17px;color:var(--head);margin:22px 0 6px}
.about p,.about li{font-size:14.5px;color:var(--ink)}
.about ul{padding-left:20px;margin:6px 0}
.about .lede{font-size:15.5px}

/* ================= map sheet ================= */
.backdrop{position:fixed;inset:0;background:rgba(15,22,14,.45);opacity:0;
  pointer-events:none;transition:opacity .22s ease;z-index:30;touch-action:none}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;color:var(--sheet-ink);
  border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);
  transform:translateY(103%);visibility:hidden;
  transition:transform .24s cubic-bezier(.2,.7,.3,1),visibility 0s .24s;
  max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);outline:none;
}
.sheet.open{transform:none;visibility:visible;
  transition:transform .24s cubic-bezier(.2,.7,.3,1),visibility 0s 0s}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px}
.sheet-grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:38px;height:4.5px;border-radius:3px;background:#d5d9d0}
.sheet-title{flex:1;font-size:15.5px;font-weight:750;color:var(--sheet-ink);padding-top:6px}
.sheet-x{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#eef1ea;border:0;
  font-size:16px;font-weight:700;color:#4a554a;display:flex;align-items:center;justify-content:center;
  position:relative}
.sheet-x::after{content:"";position:absolute;inset:-7px}
.sheet-x:active{background:#e0e4da}
.sheet-scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 16px;
  touch-action:pan-x pan-y pinch-zoom;overscroll-behavior:contain}
.map-well{position:relative;background:#fff;border:1px solid #e3e6de;border-radius:12px;overflow:hidden}
.map-well.instate{aspect-ratio:216/172}
.map-well.national{aspect-ratio:270/172}
.map-well img{display:block;width:100%;height:100%;opacity:0;transition:opacity .18s ease}
.map-well img.ld{opacity:1}
.map-well .skel{position:absolute;inset:0;background:linear-gradient(100deg,#eef1ea 40%,#f7f8f4 50%,#eef1ea 60%);
  background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.map-well .mapnote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#5f6b5c;font-size:13.5px;background:#f5f6f2;text-align:center;padding:20px}
.sheet-cap{margin-top:9px;font-size:11.5px;color:var(--sheet-muted)}

/* ================= reduced motion ================= */
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .card-body.enter > *{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hero-head"><h1>Pocket USAMM</h1><p>Loading model data…</p></header>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle"></div>
    <button class="sheet-x" id="sheetX" aria-label="Close map">✕</button>
  </div>
  <div class="sheet-scroll">
    <div class="map-well instate" id="mapWell">
      <div class="skel" id="mapSkel"></div>
      <img id="mapImg" alt="">
    </div>
    <div class="sheet-cap" id="sheetCap"></div>
  </div>
</div>

<script src="../figure-generation/visuals/state-geo.js"></script>
<script src="../figure-generation/visuals/states-data.js"></script>
<script src="../figure-generation/visuals/usamm-charts.js"></script>
<script>
(function () {
"use strict";
if (!window.USAMMCharts || !window.USAMM_STATES) {
  document.getElementById("app").innerHTML =
    '<header class="hero-head"><h1>Pocket USAMM</h1>' +
    "<p>Model data didn’t load. Keep the <b>mobile/</b> folder next to <b>figure-generation/</b> — " +
    "the app reads states-data.js and usamm-charts.js from there.</p></header>";
  return;
}
var C = window.USAMMCharts;

/* ---------- CAPS: the capability matrix (single source of honesty gating).
   No renderer touches a data global or shows a field without consulting this.
   head=false for swine is decision A1 (bins are cattle-scaled) — NEVER show
   swine head. inStats=false for beef/dairy: inbound stat tiles were never
   generated (maps were). Dairy feedlot is null in the data (no feedlots). */
var CAPS = {
  cattle: { data: window.USAMM_STATES || {}, folder: "",       infix: "",       nets: 1000, head: true,  inStats: true,  bins: true,  premises: true,  split: true,  word: "cattle",       short: "Cattle", family: "cattle" },
  beef:   { data: window.USAMM_BEEF   || {}, folder: "beef/",  infix: "_beef",  nets: 1000, head: true,  inStats: false, bins: true,  premises: true,  split: false, word: "beef cattle",  short: "Beef",   family: "cattle" },
  dairy:  { data: window.USAMM_DAIRY  || {}, folder: "dairy/", infix: "_dairy", nets: 1000, head: true,  inStats: false, bins: true,  premises: true,  split: false, word: "dairy cattle", short: "Dairy",  family: "cattle" },
  swine:  { data: window.USAMM_SWINE  || {}, folder: "swine/", infix: "_swine", nets: 250,  head: false, inStats: true,  bins: false, premises: false, split: false, word: "swine",        short: "Swine",  family: "swine" }
};
var CATS = ["cattle", "beef", "dairy", "swine"];
var SWINE_MIN_SHIPMENTS = 750;   // mirrors usamm-review.js / usamm-flyer-fill.js
var MAPS_ROOT = "../figure-generation/output/";

var STATE_LIST = Object.keys(window.USAMM_STATES || {}).sort();
var STATE_BY_KEY = {};
STATE_LIST.forEach(function (n) { STATE_BY_KEY[n.replace(/\s+/g, "")] = n; });
var keyOf = function (n) { return n.replace(/\s+/g, ""); };

var esc = function (s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
};
var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* localStorage, file://-safe */
function loadLast() { try { return localStorage.getItem("pocket-usamm:last"); } catch (e) { return null; } }
function saveLast(st) { try { localStorage.setItem("pocket-usamm:last", st); } catch (e) {} }

/* map filename contract (verified against each category's maps_svg folder):
   USAMM_<StateNoSpaces><infix>_<out|in>_<instate|national>.svg — national is OUTBOUND-only. */
function mapSrc(cat, state, dir, kind) {
  var c = CAPS[cat];
  return MAPS_ROOT + c.folder + "maps_svg/USAMM_" + keyOf(state) + c.infix + "_" + dir + "_" + kind + ".svg";
}
function sparseSwine(cat, d) {
  return cat === "swine" && (!d ||
    (typeof d.total_shipments_yr === "number" && d.total_shipments_yr < SWINE_MIN_SHIPMENTS));
}

/* ---------------- routing ---------------- */
function parseHash() {
  var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!parts.length) return { view: "picker" };
  if (parts[0] === "about") return { view: "about" };
  var st = Object.prototype.hasOwnProperty.call(STATE_BY_KEY, parts[0]) ? STATE_BY_KEY[parts[0]] : null;
  if (!st) return { view: "picker" };
  var cat = CATS.indexOf(parts[1]) >= 0 ? parts[1] : "cattle";
  var dir = parts[2] === "in" ? "in" : "out";
  var map = parts[3] === "map" && ["instate", "national", "inbound"].indexOf(parts[4]) >= 0 ? parts[4] : null;
  return { view: "card", state: st, cat: cat, dir: dir, map: map };
}
function cardHash(state, cat, dir) { return "#/" + keyOf(state) + "/" + cat + "/" + dir; }

/* ---------------- shared fragments ---------------- */
function heroCap(dir) { return "model projection · " + (dir === "in" ? "inbound" : "outgoing"); }

function chartWell(svgStr, vbW, vbH, capText) {
  return '<div class="chart" style="aspect-ratio:' + vbW + "/" + vbH + '">' + svgStr + "</div>" +
    (capText ? '<div class="cap">' + esc(capText) + "</div>" : "");
}
function num(v, fmt) {
  return '<span class="num" data-v="' + v + '" data-fmt="' + fmt + '">' +
    (fmt === "head" ? C.fmtHead(v) : C.fmtInt(v)) + "</span>";
}
function tile(vHtml, k, extra) {
  return '<div class="tile' + (extra ? " " + extra : "") + '"><div class="v">' + vHtml + '</div><div class="k">' + esc(k) + "</div></div>";
}
function mini(v, k) {
  return '<div class="mini"><div class="v">' + v + '</div><div class="k">' + esc(k) + "</div></div>";
}
var MAP_ICON = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></svg>';
function mapBtn(href, label, sizeHint) {
  return '<a class="mapbtn" href="' + href + '">' + MAP_ICON + esc(label) +
    '<span class="sz">' + esc(sizeHint) + "</span></a>";
}
function partnersProse(str, lead) {
  if (!str) return "";
  return '<p class="prose"><b>' + esc(lead) + ":</b> " + esc(String(str).replace(/, /g, " · ")) + "</p>";
}
function countyName(d) {
  var v = d.busiest_county || "";
  return v.indexOf(" - ") >= 0 ? v.split(" - ")[1] : v;
}
function honestyFooter(cat) {
  var c = CAPS[cat];
  return '<div class="footer">USAMM model projections — mean of ' + C.fmtInt(c.nets) +
    " modeled networks (" + c.word + "). Values are <b>modeled shipments</b>, not USDA/NASS counts." +
    (c.head ? " Head values are estimates from shipment-size-bin midpoints." : " Swine reports shipments only — no head estimate.") +
    ' <a href="#/about">About the model</a></div>';
}
function minimalNote(state, dir) {
  return '<section class="blk"><div class="notecard"><b>Minimal modeled swine movement</b>' +
    (dir === "in"
      ? "Swine figures for " + esc(state) + " are below the reporting threshold (fewer than " +
        C.fmtInt(SWINE_MIN_SHIPMENTS) + " modeled outgoing swine shipments/yr), so all swine views are suppressed — matching the printed flyers. See About."
      : "USAMM projects few or no outgoing swine shipments from " + esc(state) +
        " across the 250 networks — too few for reliable figures, so they are not shown.") +
    "</div></section>";
}

/* ---------------- card body ---------------- */
function cardBodyHTML(state, cat, dir) {
  var caps = CAPS[cat];
  var d = caps.data[state];
  var h = "";

  if (!d) {
    return '<section class="blk"><div class="notecard"><b>No data</b>No ' + esc(caps.word) +
      " facts were generated for " + esc(state) + ".</div></section>" + honestyFooter(cat) + nextCard(state, cat, dir);
  }
  if (sparseSwine(cat, d)) {
    return minimalNote(state, dir) + honestyFooter(cat) + nextCard(state, cat, dir);
  }

  if (dir === "in") {
    if (!caps.inStats) {
      /* beef/dairy: inbound county MAPS exist; inbound stat tiles were never
         generated. Say so — never substitute outbound numbers. */
      h += '<section class="blk"><div class="notecard"><b>Inbound stats not generated</b>' +
        "Inbound stat tiles were not generated for " + esc(caps.word) +
        " — only cattle and swine have inbound stats. The inbound county map below is available.</div>" +
        '<div class="mapbtns">' +
        mapBtn(cardHash(state, cat, dir) + "/map/inbound", "Inbound county map", "≈0.4 MB") +
        "</div></section>";
      return h + honestyFooter(cat) + nextCard(state, cat, dir);
    }
    h += '<section class="blk"><div class="hero-grid">' +
      tile(num(d.in_total_shipments_yr, "int"), "modeled shipments / yr, inbound") +
      tile(num(d.in_reach_states, "int"), "states shipping into " + state) +
      '</div><div class="cap">' + esc(heroCap(dir)) + "</div></section>";
    h += '<section class="blk"><h3>From where</h3>' +
      partnersProse(d.in_top_partner_states, "Top source states") +
      '<div class="mini-grid">' +
      mini(num(d.in_reach_counties, "int"), "origin counties, incl. in-state") +
      mini(num(d.in_reach_states, "int"), "source states (out-of-state)") +
      "</div>" +
      '<div class="mapbtns">' +
      mapBtn(cardHash(state, cat, dir) + "/map/inbound", "Inbound county map", "≈0.4 MB") +
      "</div>" +
      '<div class="cap">Inbound is assembled from other states’ ICVI fits — see About. Seasonality and size breakdowns are generated for the outgoing view only.</div>' +
      "</section>";
    return h + honestyFooter(cat) + nextCard(state, cat, dir);
  }

  /* -------- outbound (full card) -------- */
  var second = caps.head
    ? tile("≈" + num(d.est_head_yr, "head"), "est. head / yr")
    : tile(esc(d.instate_pct) + "%", "of shipments stay in-state", "gold");
  h += '<section class="blk"><div class="hero-grid">' +
    tile(num(d.total_shipments_yr, "int"), "modeled shipments / yr") + second +
    '</div><div class="cap">' + esc(heroCap(dir)) + "</div></section>";

  h += '<section class="blk"><h3>Stays vs. leaves</h3>' +
    chartWell(C.donutInStateLeaving(d, { size: "M" }), 250, 150,
      "Share staying in-state vs leaving · model projection · outgoing") + "</section>";

  h += '<section class="blk"><h3>Where it goes</h3>' +
    partnersProse(d.top_partner_states, "Top out-of-state partners") +
    chartWell(C.spokeNetwork(d, { size: "M" }), 272, 158,
      "Top out-of-state destinations · model projection · outgoing") + "</section>";

  h += '<section class="blk"><h3>When it moves</h3>' +
    '<p class="prose">Peak season: <b>' + esc(d.peak_season || "—") + "</b>" +
    (typeof d.peak_season_pct === "number" ? " — " + d.peak_season_pct + "% of the year’s shipments." : ".") + "</p>" +
    chartWell(C.seasonBars(d, { size: "M" }), 252, 150,
      "Share of shipments by quarter · model projection · outgoing") + "</section>";

  h += '<section class="blk"><h3>County detail</h3>' +
    (d.busiest_county ? '<p class="prose"><b>' + esc(countyName(d)) + " County</b> alone: " +
      C.fmtInt(d.busiest_county_ship) + " modeled shipments/yr.</p>" : "") +
    '<div class="mapbtns">' +
    mapBtn(cardHash(state, cat, dir) + "/map/instate", "In-state county map", "≈0.4 MB") +
    mapBtn(cardHash(state, cat, dir) + "/map/national", "National county map", "≈1.3 MB") +
    "</div></section>";

  var minis = mini(num(d.reach_states, "int"), "states reached") +
              mini(num(d.reach_counties, "int"), "counties reached");
  if (caps.premises && typeof d.feedlot_pct === "number") minis += mini(d.feedlot_pct + "%", "to feedlots");
  if (caps.premises && typeof d.market_pct === "number") minis += mini(d.market_pct + "%", "to markets");
  if (caps.split && typeof d.beef_pct === "number" && typeof d.dairy_pct === "number") {
    minis += mini(d.beef_pct + "%", "beef commodity") + mini(d.dairy_pct + "%", "dairy commodity");
  }
  h += '<section class="blk"><h3>Reach &amp; makeup</h3><div class="mini-grid">' + minis + "</div>" +
    (caps.bins && d.volume_bins && d.volume_bins.length
      ? '<div style="margin-top:12px">' + chartWell(C.sizeSparkbar(d), 300, 150,
          "Distribution of shipment sizes (head/shipment) · model projection · outgoing") + "</div>"
      : "") +
    "</section>";

  return h + honestyFooter(cat) + nextCard(state, cat, dir);
}

function nextCard(state, cat, dir) {
  var i = STATE_LIST.indexOf(state);
  var nxt = STATE_LIST[(i + 1) % STATE_LIST.length];
  return '<a class="row" href="' + cardHash(nxt, cat, dir) + '"><span class="ab">' +
    esc(C.abbr(nxt)) + '</span><span class="nm">Next: ' + esc(nxt) +
    '</span><span class="ch">›</span></a>';
}

/* ---------------- screens ---------------- */
function renderPicker() {
  var last = loadLast();
  var h = '<header class="hero-head"><h1>Pocket USAMM</h1>' +
    "<p>Modeled cattle &amp; swine movement, in your pocket — 15 states from the CSU USAMM models.</p></header>";
  if (last && STATE_BY_KEY[keyOf(last)]) {
    var ld = CAPS.cattle.data[last];
    h += '<div class="sect-label">Pick up where you left off</div><div class="list">' +
      '<a class="row resume" href="' + cardHash(last, "cattle", "out") + '">' +
      '<span class="ab">' + esc(C.abbr(last)) + '</span>' +
      '<span class="nm"><span class="tagline">Last viewed</span><br>' + esc(last) + "</span>" +
      (ld ? '<span class="sc">≈' + C.fmtHead(ld.total_shipments_yr) + " cattle<br>shipments/yr</span>" : "") +
      '<span class="ch">›</span></a></div>';
  }
  h += '<div class="sect-label">All states</div><div class="list">' +
    STATE_LIST.map(function (n) {
      var d = CAPS.cattle.data[n];
      return '<a class="row" href="' + cardHash(n, "cattle", "out") + '">' +
        '<span class="ab">' + esc(C.abbr(n)) + '</span>' +
        '<span class="nm">' + esc(n) + "</span>" +
        '<span class="sc">≈' + C.fmtHead(d.total_shipments_yr) + " cattle<br>shipments/yr</span>" +
        '<span class="ch">›</span></a>';
    }).join("") + "</div>";
  h += '<div class="pagefoot">All values are USAMM model projections — not USDA/NASS counts.<br>' +
    '<a href="#/about">About the model</a></div>';
  app.innerHTML = '<main>' + h + "</main>";
  document.title = "Pocket USAMM";
  window.scrollTo(0, 0);
}

function segHTML(state, cat, dir) {
  var ci = CATS.indexOf(cat);
  var cbtns = CATS.map(function (c) {
    return '<button data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + CAPS[c].short + "</button>";
  }).join("");
  return '<div class="seg cats' + (cat === "swine" ? " swine" : "") + '" id="segCats">' +
      '<div class="thumb" style="transform:translateX(' + ci * 100 + '%)"></div>' + cbtns + "</div>" +
    '<div class="seg dirs' + (cat === "swine" ? " swine" : "") + '" id="segDirs">' +
      '<div class="thumb" style="transform:translateX(' + (dir === "in" ? 100 : 0) + '%)"></div>' +
      '<button data-dir="out" aria-pressed="' + (dir === "out") + '">Outgoing</button>' +
      '<button data-dir="in" aria-pressed="' + (dir === "in") + '">Inbound</button></div>';
}

var currentCardState = null;
function renderCard(r) {
  var sameState = currentCardState === r.state && document.getElementById("cardbody");
  if (!sameState) {
    app.innerHTML =
      '<div class="topbar"><div class="tb-row">' +
      '<a class="tb-back" href="#/" aria-label="All states">‹ States</a>' +
      '<div class="tb-title">' + esc(r.state) + "</div>" +
      '<a class="tb-about" href="#/about" aria-label="About the model">i</a>' +
      '</div><div id="segwrap">' + segHTML(r.state, r.cat, r.dir) + "</div></div>" +
      '<main class="card-body" id="cardbody"></main>';
    currentCardState = r.state;
    window.scrollTo(0, 0);
  } else {
    document.getElementById("segwrap").innerHTML = segHTML(r.state, r.cat, r.dir);
  }
  var body = document.getElementById("cardbody");
  body.classList.remove("enter");
  body.innerHTML = cardBodyHTML(r.state, r.cat, r.dir);
  void body.offsetWidth;           /* restart the enter animation */
  body.classList.add("enter");
  animateCounts(body);
  wireSegs(r);
  document.title = r.state + " · Pocket USAMM";
  prefetchMap(r);
}

function wireSegs(r) {
  /* replace (not push) so flicking through categories/directions doesn't
     flood history — Back always returns to the picker in one swipe */
  document.getElementById("segCats").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-cat]");
    if (b) location.replace(cardHash(r.state, b.getAttribute("data-cat"), r.dir));
  });
  document.getElementById("segDirs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-dir]");
    if (b) location.replace(cardHash(r.state, r.cat, b.getAttribute("data-dir")));
  });
}

function renderAbout() {
  currentCardState = null;
  app.innerHTML =
    '<div class="topbar"><div class="tb-row">' +
    '<a class="tb-back" href="#/" aria-label="Back">‹ Back</a>' +
    '<div class="tb-title">About the model</div><span style="width:34px"></span></div></div>' +
    '<main class="about">' +
    '<p class="lede">Pocket USAMM is a pocket reference for the <b>U.S. Animal Movement Model (USAMM)</b>, developed at Colorado State University. It summarizes predicted county-to-county livestock shipments for 15 states, from the Cattle USAMM v3 and Swine USAMM models — the same data behind the USAMM state-outreach flyers.</p>' +
    "<h2>Every number is a model projection</h2><ul>" +
    "<li>Cattle, beef and dairy values are the <b>mean of 1,000 modeled networks</b> (Cattle USAMM v3). Swine values are the <b>mean of 250 modeled networks</b> (Swine USAMM).</li>" +
    "<li>The unit is <b>modeled shipments</b> — model predictions, not USDA/NASS survey counts.</li>" +
    "<li>Beef and dairy are the cattle model restricted to those commodities, so they carry the full cattle framing. Dairy shows no feedlot share (dairy cattle do not ship to feedlots in the model).</li></ul>" +
    "<h2>Directions</h2><ul>" +
    "<li><b>Outgoing</b> figures count shipments leaving premises in the state.</li>" +
    "<li><b>Inbound</b> figures are the same directed county-to-county network viewed from the destination side. A state’s inbound picture is assembled from <i>other</i> states’ ICVI-based model fits, so it inherits their data vintage and coverage — treat inbound as slightly softer than outbound.</li>" +
    "<li>Inbound stat tiles exist for cattle and swine. For beef and dairy, only the inbound county maps were generated.</li></ul>" +
    "<h2>“Head” is an estimate</h2><ul>" +
    "<li>Head-per-year values are <b>estimates from shipment-size-bin midpoints</b> — rough scale, not counts. They exist for the cattle family only.</li>" +
    "<li><b>Swine reports shipments only.</b> The model’s saved volume bins are cattle-scaled, so no swine head estimate is shown anywhere in this app.</li></ul>" +
    "<h2>What is not here</h2><ul>" +
    "<li><b>Inventory</b> (how many animals reside in a state) is <b>not modeled</b> — USAMM predicts movement, not stock. This app never shows inventory.</li>" +
    "<li>Detail is county-level only; no premises-level information is shown.</li></ul>" +
    "<h2>Swine vintage &amp; sparse states</h2><ul>" +
    "<li>The swine model is fit to 2010–2011 ICVI data.</li>" +
    "<li>States with fewer than 750 modeled outgoing swine shipments per year (Montana, New Mexico, New York) show a <i>minimal modeled swine movement</i> note instead of figures — matching the printed flyers.</li></ul>" +
    "<h2>Where the numbers come from</h2>" +
    '<p>Everything is generated by the same pipeline as the USAMM outreach flyers. The authoritative methods and per-figure data lineage live in <b>USAMM_figures_methods.pdf</b> and the widget-data-provenance documents shipped with the flyer package.</p>' +
    "<h2>Companion app</h2>" +
    '<p><a href="../drove/"><b>DROVE</b></a> — the same modeled flows as a living, touchable network: animated streams, MAP↔RANK morphs, and the county maps in a slide-in lens. Same data, same honesty rules, in motion.</p>' +
    "</main>";
  document.title = "About · Pocket USAMM";
  window.scrollTo(0, 0);
}

/* ---------------- count-up ---------------- */
function animateCounts(rootEl) {
  var els = rootEl.querySelectorAll(".num[data-v]");
  Array.prototype.forEach.call(els, function (el) {
    var v = +el.getAttribute("data-v");
    var fmt = el.getAttribute("data-fmt") === "head" ? C.fmtHead : C.fmtInt;
    if (reduced || !(v > 0)) { el.textContent = fmt(v); return; }
    var t0 = performance.now(), dur = 380, from = v * 0.82;
    requestAnimationFrame(function tick(t) {
      var p = Math.min(1, (t - t0) / dur);
      p = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (v - from) * p);
      if (p < 1) requestAnimationFrame(tick);
    });
  });
}

/* ---------------- map sheet ---------------- */
var sheet = document.getElementById("sheet"),
    backdrop = document.getElementById("backdrop"),
    mapWell = document.getElementById("mapWell"),
    mapImg = document.getElementById("mapImg"),
    mapSkel = document.getElementById("mapSkel"),
    sheetTitle = document.getElementById("sheetTitle"),
    sheetCap = document.getElementById("sheetCap");
var mapTimer = null;
var sheetTrigger = null;      /* element to restore focus to on close */
var pushedMap = false;        /* true when the map hash was pushed by an in-app tap */
var lockY = 0;
document.addEventListener("click", function (e) {
  if (e.target.closest && e.target.closest(".mapbtn")) pushedMap = true;
});

function openSheet(r) {
  var kind = r.map;                                   /* instate | national | inbound */
  var dir = kind === "inbound" ? "in" : "out";
  var fileKind = kind === "national" ? "national" : "instate";
  var src = mapSrc(r.cat, r.state, dir, fileKind);
  sheetTitle.textContent = r.state + " — " + CAPS[r.cat].word + ", " +
    (kind === "national" ? "national" : "in-state") + ", " + (dir === "in" ? "inbound" : "outbound");
  sheetCap.textContent = dir === "in"
    ? "Expected county-level shipment destinations · model projection · inbound"
    : (kind === "national"
        ? "National reach · model projection · outgoing"
        : "Expected county-level shipment origins · model projection · outgoing");
  mapWell.className = "map-well " + fileKind;
  var old = mapWell.querySelector(".mapnote"); if (old) old.remove();
  mapImg.classList.remove("ld");
  mapImg.removeAttribute("src");
  mapImg.alt = sheetTitle.textContent + " county map (USAMM model projection)";
  mapSkel.style.display = "";
  clearTimeout(mapTimer);
  /* debounce so rapid open/close or segment flips never fire a wasted 370KB+ request */
  mapTimer = setTimeout(function () {
    mapImg.onload = function () { mapSkel.style.display = "none"; mapImg.classList.add("ld"); };
    mapImg.onerror = function () {
      mapSkel.style.display = "none";
      var n = document.createElement("div");
      n.className = "mapnote";
      n.textContent = "County map unavailable";
      mapWell.appendChild(n);
    };
    mapImg.src = src;
  }, 250);
  if (!sheet.classList.contains("open")) {
    var ae = document.activeElement;
    sheetTrigger = ae && ae.closest && ae.closest(".mapbtn") ? ae : null;
    lockY = window.scrollY;
    document.body.style.top = -lockY + "px";
    document.body.classList.add("has-sheet");
    sheet.classList.add("open");
    backdrop.classList.add("open");
    sheet.setAttribute("aria-modal", "true");
    if ("inert" in app) app.inert = true; else app.setAttribute("aria-hidden", "true");
    sheet.focus({ preventScroll: true });
  }
}
function closeSheet() {
  clearTimeout(mapTimer);
  if (!sheet.classList.contains("open")) return;
  /* abort any in-flight SVG download and reset for next open */
  mapImg.onload = mapImg.onerror = null;
  mapImg.classList.remove("ld");
  mapImg.removeAttribute("src");
  mapSkel.style.display = "";
  sheet.classList.remove("open");
  backdrop.classList.remove("open");
  sheet.removeAttribute("aria-modal");
  if ("inert" in app) app.inert = false; else app.removeAttribute("aria-hidden");
  document.body.classList.remove("has-sheet");
  document.body.style.top = "";
  window.scrollTo(0, lockY);
  if (sheetTrigger && document.contains(sheetTrigger)) sheetTrigger.focus({ preventScroll: true });
  sheetTrigger = null;
  pushedMap = false;
}
function sheetDismiss() {
  var r = parseHash();
  if (r.view === "card" && r.map) {
    /* if we pushed the map entry, Back both closes the sheet AND unwinds
       history — an iOS back-swipe afterwards won't reopen the map */
    if (pushedMap) history.back();
    else location.replace(cardHash(r.state, r.cat, r.dir));
  } else closeSheet();
}
document.getElementById("sheetX").addEventListener("click", sheetDismiss);
backdrop.addEventListener("click", sheetDismiss);
window.addEventListener("keydown", function (e) { if (e.key === "Escape") sheetDismiss(); });

/* prefetch the current view's in-state map once things settle (skipped on
   Save-Data connections; national maps are never prefetched) */
var prefTimer = null;
function prefetchMap(r) {
  clearTimeout(prefTimer);
  var conn = navigator.connection;
  if (conn && conn.saveData) return;
  var d = CAPS[r.cat].data[r.state];
  if (sparseSwine(r.cat, d)) return;
  prefTimer = setTimeout(function () {
    var i = new Image();
    i.fetchPriority = "low";          /* never compete with a user-triggered sheet load */
    i.src = mapSrc(r.cat, r.state, r.dir === "in" ? "in" : "out", "instate");
  }, 450);
}

/* ---------------- boot ---------------- */
var app = document.getElementById("app");
function onRoute() {
  clearTimeout(prefTimer);            /* leaving a card cancels its pending prefetch */
  var r = parseHash();
  if (r.view === "picker") { currentCardState = null; closeSheet(); renderPicker(); }
  else if (r.view === "about") { closeSheet(); renderAbout(); }
  else {
    /* honesty gate: the map sheet obeys the same suppression as the card —
       a deep link can't surface a sparse-swine (or missing-data) map */
    var d0 = CAPS[r.cat].data[r.state];
    if (r.map && (!d0 || sparseSwine(r.cat, d0))) {
      location.replace(cardHash(r.state, r.cat, r.dir));
      return;
    }
    var key = r.state + "|" + r.cat + "|" + r.dir;
    var stale = key !== onRoute._k || !document.getElementById("cardbody");
    onRoute._k = key;                 /* set BEFORE render so a throw is never cached as current */
    if (stale) renderCard(r);
    if (r.map) openSheet(r); else closeSheet();
    saveLast(r.state);
  }
  if (r.view !== "card") onRoute._k = null;
}
window.addEventListener("hashchange", onRoute);
onRoute();

/* test hook for the honesty sweep (not used by the UI) */
window.PocketUSAMM = { cardBodyHTML: cardBodyHTML, mapSrc: mapSrc, CAPS: CAPS, STATES: STATE_LIST };
})();
</script>
</body>
</html>
